name: store screenshots

on:
  pull_request:
    types:
      - closed
    branches:
      - develop
      - '*/develop'
  create:

jobs:
  store-screenshot-test:
    if: (github.event.ref_type == 'branch' && endsWith(github.event.ref, '/develop')) || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      actions: write # for upload-artifact

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Check if companion branch exists
        id: check_companion_branch
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        run: |
          COMPANION_BRANCH="companion_${{ github.event.pull_request.head.ref }}"
          if git ls-remote --exit-code --heads origin "$COMPANION_BRANCH"; then
            echo "Companion branch exists: $COMPANION_BRANCH"
            echo "COMPANION_BRANCH_EXISTS=true" >> $GITHUB_ENV
          else
            echo "Companion branch does not exist: $COMPANION_BRANCH"
            echo "COMPANION_BRANCH_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Download artifact
        id: download_artifact
        if: steps.check_companion_branch.outcome == 'success' && env.COMPANION_BRANCH_EXISTS == 'false'
        uses: dawidd6/action-download-artifact@v8
        continue-on-error: true # エラーが発生しても続行
        with:
          name: screenshots
          workflow: store_screenshots.yml
          branch: ${{ github.base_ref }}

      - name: Check if artifact exists
        if: steps.check_companion_branch.outcome == 'success' && env.COMPANION_BRANCH_EXISTS == 'false'
        run: |
          if [ "${{ steps.download_artifact.outcome }}" == "success" ]; then
            echo "Artifact exists"
            echo "ARTIFACT_EXISTS=true" >> $GITHUB_ENV
          else
            echo "Artifact does not exist"
            echo "ARTIFACT_EXISTS=false" >> $GITHUB_ENV
          fi

      # 以下の条件を満たす場合のみスクリーンショットを保存する
      # - 案件ブランチ作成時
      # - PRマージ時（以下のいずれかを満たす場合）
      #   - 指定のcompanionブランチが存在する
      #   - アーティファクトが存在しない
      - name: Record screenshot
        id: record_test
        if: github.event_name == 'create' || env.COMPANION_BRANCH_EXISTS == 'true' || env.ARTIFACT_EXISTS == 'false'
        run: ./gradlew recordRoborazziDebug --stacktrace --rerun-tasks

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: steps.record_test.outcome == 'success'
        with:
          name: screenshots_upload-name
          path: screenshots
          retention-days: 30
          overwrite: true
