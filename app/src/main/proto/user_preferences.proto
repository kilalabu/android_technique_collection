syntax = "proto3";

import "theme_brand.proto";
import "dark_theme_config.proto";
option java_package = "com.example.android_technique_collection";
option java_multiple_files = true;

message UserPreferences {
    // proto3にはSet<String>がないため、キーの有無で管理する
    // キーが存在する（例: {"android": true}） → フォロー済み
    // キーが存在しない（例: {}） → 未フォロー
    map<string, bool> followed_topic_ids = 1;
    map<string, bool> followed_author_ids = 2;
    map<string, bool> bookmarked_news_resource_ids = 3;
    map<string, bool> viewed_news_resource_ids = 4;

    ThemeBrandProto theme_brand = 5;
    DarkThemeConfigProto dark_theme_config = 6;

    bool should_hide_onboarding = 7;
    bool use_dynamic_color = 8;

    // NEXT AVAILABLE ID: 9
}
